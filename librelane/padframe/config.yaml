SYNTH_HIERARCHY_MODE: keep

# Macro-only padframe: pads + placed wrapper macro, no std-cell logic to map.
SYNTH_ELABORATE_ONLY: true

RUN_CTS: false
RUN_TAP_ENDCAP_INSERTION: false
RUN_FILL_INSERTION: false
RUN_IRDROP_REPORT: false
