- sky130_ef_io__vssio_hvc_clamped_pad/VSSIO_PAD
- sky130_ef_io__vdda_hvc_clamped_pad/VDDA_PAD
- sky130_ef_io__vssa_hvc_clamped_pad/VSSA_PAD

