# No functional clock in the passive frame; provide SDCs for the STA steps.
PNR_SDC_FILE: dir::chip.sdc
SIGNOFF_SDC_FILE: dir::chip.sdc
FALLBACK_SDC: dir::chip.sdc

# Floorplan: double-wide die (2 x 3588 um) x (5188 um), height unchanged.
FP_SIZING: absolute
DIE_AREA: [0, 0, 7176, 5188]
CORE_AREA: [210.685, 210.685, "expr::$DIE_AREA[2] - 210.685", "expr::$DIE_AREA[3] - 210.685"]

# Keep routing outside the pad ring. Pad cells (e.g. gpiov2) extend ~197.965 um
# from the die edge; LEF OBS / metal end near ~199.7 um (same cut-in as
# sky130-fabulous-testchip). A looser 197.0 cut-in previously left a
# 197..199.7 um band where the router entered the pad interior (it does not
# see pad GDS), causing met2 spacing (m2.2). Do not push past ~199.7 or pad
# core pins fall inside the blockage and detailed routing shorts.
ROUTING_OBSTRUCTIONS:
- [met1, 0, 0, 199.7, "expr::$DIE_AREA[3]"]
- [met2, 0, 0, 199.7, "expr::$DIE_AREA[3]"]
- [met3, 0, 0, 199.7, "expr::$DIE_AREA[3]"]
- [met4, 0, 0, 199.7, "expr::$DIE_AREA[3]"]
- [met5, 0, 0, 199.7, "expr::$DIE_AREA[3]"]
- [met1, "expr::$DIE_AREA[2] - 199.7", 0, "expr::$DIE_AREA[2]", "expr::$DIE_AREA[3]"]
- [met2, "expr::$DIE_AREA[2] - 199.7", 0, "expr::$DIE_AREA[2]", "expr::$DIE_AREA[3]"]
- [met3, "expr::$DIE_AREA[2] - 199.7", 0, "expr::$DIE_AREA[2]", "expr::$DIE_AREA[3]"]
- [met4, "expr::$DIE_AREA[2] - 199.7", 0, "expr::$DIE_AREA[2]", "expr::$DIE_AREA[3]"]
- [met5, "expr::$DIE_AREA[2] - 199.7", 0, "expr::$DIE_AREA[2]", "expr::$DIE_AREA[3]"]
- [met1, 0, 0, "expr::$DIE_AREA[2]", 199.7]
- [met2, 0, 0, "expr::$DIE_AREA[2]", 199.7]
- [met3, 0, 0, "expr::$DIE_AREA[2]", 199.7]
- [met4, 0, 0, "expr::$DIE_AREA[2]", 199.7]
- [met5, 0, 0, "expr::$DIE_AREA[2]", 199.7]
- [met1, 0, "expr::$DIE_AREA[3] - 199.7", "expr::$DIE_AREA[2]", "expr::$DIE_AREA[3]"]
- [met2, 0, "expr::$DIE_AREA[3] - 199.7", "expr::$DIE_AREA[2]", "expr::$DIE_AREA[3]"]
- [met3, 0, "expr::$DIE_AREA[3] - 199.7", "expr::$DIE_AREA[2]", "expr::$DIE_AREA[3]"]
- [met4, 0, "expr::$DIE_AREA[3] - 199.7", "expr::$DIE_AREA[2]", "expr::$DIE_AREA[3]"]
- [met5, 0, "expr::$DIE_AREA[3] - 199.7", "expr::$DIE_AREA[2]", "expr::$DIE_AREA[3]"]

# Power / ground nets (preserved multi-domain). LibreLane 3 only accepts the
# plural VDD_NETS/GND_NETS; the singular VDD_NET/GND_NET keys abort the flow.
VDD_NETS: [vccd, vccd1, vccd2, vddio, vdda, vdda1, vdda2]
GND_NETS: [vssd, vssd1, vssd2, vssio, vssa, vssa1, vssa2]

# PDN is intentionally omitted from the padframe -- it will be drawn manually
# later. The OpenROAD.GeneratePDN / Odb.AddPDNObstructions steps are dropped in
# meta.substituting_steps above, so all PDN_* knobs and PDN_CFG are left unset.

IGNORE_DISCONNECTED_MODULES:
- sky130_fd_io__top_power_hvc_wpad
- sky130_fd_io__top_ground_hvc_wpad
- sky130_fd_io__top_power_lvc_wpad
- sky130_fd_io__top_ground_lvc_wpad

# Multiple power pads share one domain net.
MAGIC_EXT_UNIQUE: notopports

# The double-wide user-area wrapper, placed centered in the die.
MACROS:
  double_wide_openframe_project_wrapper:
    gds:
    - dir::../../build/wrapper/gds/double_wide_openframe_project_wrapper.gds
    lef:
    - dir::../../build/wrapper/lef/double_wide_openframe_project_wrapper.lef
    pnl:
    - dir::../../verilog/gl/double_wide_openframe_project_wrapper.v
    instances:
      user_project:
        location: [210.685, 210.685]
        orientation: N

GRT_ALLOW_CONGESTION: true
PL_TARGET_DENSITY_PCT: 40
